<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#202020"><title>Viewcut</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="appbar"><span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12v12H4zM8 8h12v12H8z"/></svg>Viewcut</span>
    <div class="actions"><button data-action="destination"></button><button data-action="showDestination"></button><span class="rule"></span><button data-action="preferences"></button></div>
    <span id="destinationLabel" class="muted ellipsis"></span>
  </header>
  <main id="workspace">
    <section id="editor" aria-label="Video editor">
      <section id="playerPanel"><div id="mediaName" class="panel-title"></div><div id="stage">
        <video id="player" playsinline preload="metadata"></video>
        <div id="empty"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="15" width="44" height="34" rx="5"/><path d="m27 24 13 8-13 8z"/></svg><h1 data-i18n="emptyTitle"></h1><p data-i18n="emptyBody"></p></div>
      </div><div class="transport"><div class="actions"><button data-action="play"></button><button data-action="previous"></button><button data-action="next"></button><span class="rule"></span><button data-action="markIn"></button><button data-action="markOut"></button></div><output id="clock">00:00:00.00 / 00:00:00.00</output></div></section>
      <div id="horizontalDivider" class="divider horizontal" role="separator" tabindex="0" aria-orientation="horizontal" aria-valuemin="130" aria-valuemax="600" aria-valuenow="230" aria-label="Resize timeline"></div>
      <section id="timelinePanel"><div class="timeline-toolbar"><span data-i18n="timeline"></span><div class="actions"><button data-action="undo"></button><button data-action="redo"></button><span class="rule"></span><button data-action="zoomOut"></button><button data-action="zoomIn"></button><button data-action="fit"></button></div><div class="toolbar-spacer"></div><button data-action="export" class="accent"></button><button id="cancelExport" data-action="cancelExport" hidden></button></div>
        <div id="timelineViewport" tabindex="0" role="group" aria-label="Clip timeline"><div id="ruler"></div><div id="track"><div id="clipLayer"></div><div id="markLine"></div><div id="playhead"><span></span></div></div></div>
        <div class="timeline-footer"><span id="clipCount"></span><span class="muted" data-i18n="timelineHint"></span></div>
      </section>
    </section>
    <div id="verticalDivider" class="divider vertical" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="900" aria-valuenow="390" aria-label="Resize file browser"></div>
    <aside id="sidebar"><nav class="tabs"><button data-action="files" class="selected"></button><button data-action="clips"></button><button data-action="jobs"></button></nav>
      <div id="activeFile"><span data-i18n="nowReviewing"></span><strong id="activeName"></strong></div>
      <section id="filesPage" class="page"><div class="browser-nav actions"><button data-action="back"></button><button data-action="forward"></button><button data-action="up"></button><button data-action="refresh"></button><button data-action="openFolder"></button><button data-action="openFile"></button></div>
        <div id="breadcrumb"></div><div class="browser-tools"><input id="search" type="search" autocomplete="off"><button data-action="grid"></button><button data-action="list"></button><button data-action="fileMenu"></button></div>
        <div class="file-heading"><span data-i18n="name"></span><span data-i18n="modified"></span><span data-i18n="size"></span></div>
        <div id="fileList" class="files list" tabindex="0" role="listbox" aria-multiselectable="true"></div><div id="fileFooter" class="muted"></div>
      </section>
      <section id="clipsPage" class="page" hidden><div id="clipList" class="stack"></div></section>
      <section id="jobsPage" class="page" hidden><div id="jobList" class="stack"></div></section>
    </aside>
  </main>
  <footer class="statusbar"><span id="status" role="status" aria-live="polite"></span><progress id="progress" max="1" value="0" hidden></progress><span id="localBadge" data-i18n="localOnly"></span></footer>
  <div id="preview" hidden><video id="previewVideo" muted playsinline preload="auto" aria-hidden="true" tabindex="-1"></video><canvas width="240" height="135" hidden></canvas><output></output></div>
  <div id="contextMenu" role="menu" hidden></div>
  <dialog id="preferences"><form method="dialog"><header><h2 data-i18n="preferences"></h2><button data-action="close" value="close"></button></header><label for="language" data-i18n="language"></label><select id="language"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select><label for="theme" data-i18n="theme"></label><select id="theme"><option value="dark" data-i18n="dark"></option><option value="light" data-i18n="light"></option><option value="system" data-i18n="system"></option></select><p class="muted" data-i18n="autoSave"></p><p><a href="./third-party-notices.txt" target="_blank" rel="noopener" data-i18n="thirdParty"></a></p></form></dialog>
  <dialog id="renameDialog"><form><h2 data-i18n="renameClip"></h2><input id="clipName" maxlength="100" autocomplete="off"><p id="renameError" role="alert"></p><div class="dialog-actions"><button type="button" data-action="cancelRename"></button><button type="submit" data-action="confirmRename" class="accent"></button></div></form></dialog>
  <input id="fileInput" type="file" accept="video/*,.mov,.mp4" multiple hidden>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <dialog id="downloadDialog"><form method="dialog"><h2 data-i18n="downloadReady"></h2><p data-i18n="downloadHelp"></p><div class="dialog-actions"><button type="button" data-action="downloadZip" class="accent"></button><button value="close" data-action="close"></button></div></form></dialog>
</body></html>
